<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapot Penilaian Tengah Semester</title>
<style>
:root{--bg:#eaf5ee;--card:rgba(255,255,255,.72);--tx:#12261a;--mut:#5b7266;--bd:rgba(20,90,50,.16);--ac:#15803d;--acx:#fff;--bad:#c0392b;--hl:rgba(34,197,94,.14);--inp:rgba(255,255,255,.75);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06140c;--card:rgba(24,48,34,.62);--tx:#e6f3ea;--mut:#9bb5a5;--bd:rgba(255,255,255,.11);--ac:#4ade80;--acx:#052e16;--bad:#ff8a7a;--hl:rgba(74,222,128,.14);--inp:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--bg:#06140c;--card:rgba(24,48,34,.62);--tx:#e6f3ea;--mut:#9bb5a5;--bd:rgba(255,255,255,.11);--ac:#4ade80;--acx:#052e16;--bad:#ff8a7a;--hl:rgba(74,222,128,.14);--inp:rgba(255,255,255,.07)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:40}
.side{width:244px;flex:0 0 244px;background:var(--card);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 10px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 8px 10px}
.grp{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 4px}
.side .nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:9px 10px;border-radius:8px}
.side .nav:hover{background:var(--hl)}
.side .nav.on{background:var(--ac);color:var(--acx)}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .ttl{flex:1;font-weight:700;font-size:16px}
.burger,.scrim{display:none}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{font-size:26px;display:block}.stat span{color:var(--mut);font-size:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.prog{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px}
.prog>span:first-child{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;height:8px;background:var(--hl);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0}
.lg th,.lg td{font-size:12px}
.clk{text-align:right;line-height:1.2;white-space:nowrap}.clk b{display:block;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ac)}.clk span{font-size:11px;color:var(--mut)}
@media (max-width:560px){.clk span{display:none}.clk b{font-size:15px}}
#login{position:fixed;inset:0;background:var(--bg);z-index:100;align-items:center;justify-content:center;padding:16px;overflow:auto}
@media (max-width:860px){.side{position:fixed;left:0;top:0;height:100%;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.25)}.side.open{transform:none}.burger{display:inline-block}.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.del{color:var(--bad)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600}
td input{min-width:60px}
td.n,th.n{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row>*{flex:0 0 auto}.row .grow{flex:1 1 200px}
.low{color:var(--bad);font-weight:600}
.hint{color:var(--mut);font-size:12px}
.rapot{background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:26px 30px;margin:0 auto 14px;max-width:800px;font-size:13px}
.rapot th,.rapot td{border:1px solid #444;color:#111}.rapot th{background:#eee;font-size:12px}
.rapot .kop{text-align:center;border-bottom:3px double #111;padding-bottom:8px;margin-bottom:10px}
.rapot .kop b{font-size:16px;display:block}
.rapot .info td{border:none;padding:1px 4px}
.rapot .ttd{display:flex;justify-content:space-between;text-align:center;margin-top:18px;gap:8px}
.rapot .ttd div{flex:1}.rapot .ttd .sp{height:56px}
@media print{
 body{background:#fff}.wrap{padding:0;max-width:none}
 .noprint{display:none!important}.app{display:block}:root:root:root{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#999;--hl:#eee;--bad:#b00}
 .rapot{border:none;border-radius:0;margin:0;padding:6mm 4mm;max-width:none;break-after:page;page-break-after:always}
 .rapot:last-child{break-after:auto;page-break-after:auto}
 @page{size:A4;margin:12mm}
}

body{background:radial-gradient(900px 520px at 8% -8%,rgba(34,197,94,.34),transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(16,185,129,.26),transparent 60%),radial-gradient(900px 600px at 50% 112%,rgba(5,150,105,.28),transparent 60%),var(--bg);background-attachment:fixed}
body::before{background:var(--bg)}
input,select,textarea{background:var(--inp)}
select option{color:#111;background:#fff}
.card,.stat,.top{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card,.stat{border-radius:16px;box-shadow:0 6px 24px rgba(10,60,30,.08)}
.stat{background:linear-gradient(135deg,var(--hl),transparent),var(--card)}.stat b{color:var(--ac)}
.side{background:linear-gradient(185deg,#0f5132,#0a2e1c 55%,#06180e);border-right:none;color:#e8f6ec}
.side .nav{color:#d5ecdc}.side .nav:hover{background:rgba(255,255,255,.09)}
.side .nav.on{background:rgba(255,255,255,.17);color:#fff;box-shadow:inset 3px 0 0 #4ade80}
.side .grp,.side .hint{color:#8fbba0}.brand{color:#fff}
.bl{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.bl img{width:34px;height:auto}.bl.big{width:76px;height:76px}.bl.big img{width:62px}
.hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,#0f5132,#16a34a 70%,#4ade80);box-shadow:0 10px 30px rgba(22,163,74,.28)}
.hero h2{margin:0 0 4px;font-size:20px}.hero p{margin:0;opacity:.92;font-size:13px}
.rapot .kop{overflow:hidden;min-height:64px}
#login{background:radial-gradient(520px 420px at 22% 18%,rgba(74,222,128,.55),transparent 62%),radial-gradient(560px 460px at 88% 28%,rgba(6,78,59,.9),transparent 66%),radial-gradient(640px 480px at 70% 105%,rgba(163,230,53,.38),transparent 62%),radial-gradient(520px 420px at 0% 92%,rgba(20,83,45,.95),transparent 62%),#04140a}
.lcard{width:100%;max-width:340px;padding:30px 28px 26px;border-radius:34px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.5);color:#fff;text-align:center}
.lav{width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.95);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.lav img{width:92px;height:auto;max-height:88px;object-fit:contain}
.lt{font-weight:700;font-size:16px}.ls{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.lf{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid rgba(255,255,255,.7);margin-top:20px;padding:4px 2px;color:rgba(255,255,255,.9)}
.lf input{background:transparent;border:none;outline:none;color:#fff;padding:7px 2px;font-size:15px;border-radius:0}
.lf input::placeholder{color:rgba(255,255,255,.7)}
.lr{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px}
.lr label{display:flex;gap:6px;align-items:center;color:rgba(255,255,255,.85);margin:0;font-size:12px}.lr label input{width:auto}
.lr a{color:rgba(255,255,255,.85);font-style:italic;text-decoration:none}
.le{min-height:34px;margin-top:8px;font-size:12px;color:#fecaca}
.lb{width:100%;padding:13px;border:none;border-radius:14px;color:#fff;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#14532d,#16a34a 55%,#4ade80);box-shadow:0 8px 20px rgba(22,163,74,.4)}
.lfile{color:#fff;font-size:12px;border:none;background:transparent;padding:0}
@media print{body{background:#fff!important}.card,.stat{box-shadow:none;backdrop-filter:none}}
</style></head>

  return`<tr><td>${i+1}</td><td>${esc(s.nama)}</td>${a.map((v,j)=>`<td class='n${v!=null&&v<S.mapel[j].kkm?' low':''}'>${v==null?'-':v}</td>`).join('')}<td class='n'>${sum}</td><td class='n'>${r==null?'-':r.toFixed(1)}</td><td class='n'>${rank(s).split(' ')[0]}</td></tr>`}).join('');
 return`<div class='card'><div class='row noprint'><button class='pri' onclick='window.print()'>Cetak leger</button><button onclick='csv()'>Unduh CSV</button></div><div style='text-align:center;font-weight:700;margin-bottom:6px'>LEGER NILAI PTS KELAS ${esc(S.set.kelas)} — SEMESTER ${esc(S.set.semester).toUpperCase()} ${esc(S.set.tahun)}</div><div class='scroll'><table class='lg'><tr><th>No</th><th>Nama</th>${S.mapel.map(m=>`<th class='n'>${esc(m.nama)}</th>`).join('')}<th class='n'>Jumlah</th><th class='n'>Rata-rata</th><th class='n'>Rank</th></tr>${rows}</table></div></div>`}
function csv(){const Q=String.fromCharCode(34),q=v=>Q+String(v==null?'':v).split(Q).join(Q+Q)+Q;
 const h=['No','NIS','Nama',...S.mapel.map(m=>m.nama),'Jumlah','Rata-rata','Rank'];
 const r=S.siswa.map((s,i)=>{const a=S.mapel.map(m=>akhir(s,m)),rt=rata(s);return[i+1,s.nis,s.nama,...a,a.reduce((x,y)=>x+(y||0),0),rt==null?'':rt.toFixed(1),rank(s).split(' ')[0]]});
 try{const b=new Blob(['\ufeff'+[h,...r].map(x=>x.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='leger-nilai-pts.csv';a.click()}catch(e){alert('Unduhan tidak tersedia di halaman ini.')}}

async function hp(pw,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;const t=salt+':'+pw;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return'x'+h}}

 let ru='';try{ru=localStorage.getItem(K+'-ru')||''}catch(e){}

 const IL="<svg viewBox='0 0 24 24' width='20' height='20' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round'><rect x='5' y='11' width='14' height='10' rx='2'/><path d='M8 11V8a4 4 0 018 0v3'/></svg>";
 ov.innerHTML=`<div class='lcard'><div class='lav'><img src='${LOGO}'></div><div class='lt'>Rapot Penilaian Tengah Semester</div><div class='ls'>${setup?'Buat akun administrator untuk memulai':'Silakan masuk untuk melanjutkan'}</div>

 <div id='lg_e' class='le'></div>

 setTimeout(()=>{const i=document.getElementById(setup?'lg_n':(ru?'lg_p':'lg_u'));if(i)i.focus()},0)}

async function doAuth(setup){const u=g('lg_u').trim().toLowerCase(),p=g('lg_p'),er=document.getElementById('lg_e');
 if(!u||p.length<6){er.textContent='Username wajib diisi dan password minimal 6 karakter.';return}
 if(setup){const salt=uid()+uid();S.users.push({id:uid(),nama:g('lg_n').trim()||'Administrator',user:u,salt,hash:await hp(p,salt),role:'admin',mapel:[]});save();ME=S.users[S.users.length-1];sess();tab='home';render();return}
 const a=S.users.find(x=>x.user===u);
 if(!a||a.hash!==await hp(p,a.salt)){er.textContent='Username atau password salah.';return}
 try{if(document.getElementById('lg_r').checked)localStorage.setItem(K+'-ru',u);else localStorage.removeItem(K+'-ru')}catch(e){}ME=a;sess();tab='home';render()}

function kirim(){const mm=mymapel().map(m=>m.id),out={tipe:'nilai-guru',uid:ME.id,guru:ME.nama,nilai:S.siswa.map(s=>{const v={};mm.forEach(id=>{if(s.nilai&&s.nilai[id])v[id]=s.nilai[id]});return{id:s.id,nilai:v}})};
 try{const b=new Blob([JSON.stringify(out)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nilai-'+ME.user+'.json';a.click()}catch(e){alert('Unduhan tidak tersedia di halaman ini.')}}
function gabung(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),u=S.users.find(z=>z.id===d.uid);if(d.tipe!=='nilai-guru'||!u)throw 0;let c=0;d.nilai.forEach(x=>{const s=S.siswa.find(y=>y.id===x.id);if(s){s.nilai=s.nilai||{};Object.keys(x.nilai).forEach(k=>{if((u.mapel||[]).includes(k)&&S.mapel.some(m=>m.id===k)){s.nilai[k]=x.nilai[k];c++}})}});save();render();alert(c+' data nilai dari '+u.nama+' digabungkan.')}catch(e){alert('File nilai guru tidak valid atau akun gurunya tidak ada.')}};r.readAsText(f)}
function vGuru(){return`<div class='card'><b>Akun pengguna</b><p class='hint'>${SRV()?'Akun dan data tersimpan di Google Sheets dan dipakai bersama oleh semua guru.':'Login mengatur akses di aplikasi pada perangkat ini. Data belum otomatis tersinkron antar perangkat.'}</p><div class='scroll'><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Mapel</th><th></th></tr>${S.users.map((u,i)=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.user)}</td><td>${u.role==='admin'?'Admin':'Guru'}</td><td>${u.role==='admin'?'Semua':S.mapel.filter(m=>(u.mapel||[]).includes(m.id)).map(m=>esc(m.nama)).join(', ')||'-'}</td><td style='white-space:nowrap'><button onclick='editU(${i})'>Ubah</button> ${u.id!==ME.id?`<button class='del' onclick='delU(${i})'>Hapus</button>`:''}</td></tr>`).join('')}</table></div></div>
<div class='card'><b id='ft'>Tambah akun guru</b><div class='grid'><div><label>Nama guru</label><input id='g_n'></div><div><label>Username</label><input id='g_u'></div><div><label>Password (min. 6)</label><input id='g_p'></div></div><label style='margin-top:8px'>Mapel yang diampu</label><div id='g_m' class='row'>${S.mapel.map(m=>`<label style='display:flex;gap:4px;align-items:center;color:var(--tx);font-size:13px'><input type='checkbox' style='width:auto' value='${m.id}'>${esc(m.nama)}</label>`).join('')}</div><input type='hidden' id='g_i' value=''><div class='row'><button class='pri' onclick='saveU()'>Simpan akun</button></div></div>

async function saveU(){const n=g('g_n').trim(),u=g('g_u').trim().toLowerCase(),p=g('g_p'),id=g('g_i'),mp=[...document.querySelectorAll('#g_m input:checked')].map(x=>x.value);
 if(!n||!u){alert('Nama dan username wajib diisi.');return}
 if(S.users.some(x=>x.user===u&&x.id!==id)){alert('Username sudah dipakai.');return}
 if(id){const x=S.users.find(y=>y.id===id);if(p&&p.length<6){alert('Password minimal 6 karakter.');return}x.nama=n;x.user=u;x.mapel=mp;if(p){x.salt=uid()+uid();x.hash=await hp(p,x.salt)}}
 else{if(p.length<6){alert('Password minimal 6 karakter.');return}const salt=uid()+uid();S.users.push({id:uid(),nama:n,user:u,salt,hash:await hp(p,salt),role:'guru',mapel:mp})}
 save();render()}

 <div class='card'><b>Nilai di bawah KKM</b>${under.slice(0,8).map(x=>`<div class='chk'>\u2022 ${esc(x[0].nama)} \u2014 ${esc(x[1].nama)}: <span class='low'>${x[2]}</span></div>`).join('')||'<p class="hint">Tidak ada.</p>'}${under.length>8?`<p class='hint'>dan ${under.length-8} lainnya, lihat Leger Nilai.</p>`:''}</div>`};
window.vHomeGuru=function(){const R=[];S.kelas.forEach(k=>kmap(k).filter(m=>mymapel().some(x=>x.id===m.id)).forEach(m=>{const L=ksis(k),c=L.filter(s=>akhir(s,m)!=null).length,u=L.filter(s=>{const a=akhir(s,m);return a!=null&&a<m.kkm}).length;R.push(`<div class='prog'><span>${esc(k.nama)} \u2014 ${esc(m.nama)}</span><div class='bar'><i style='width:${L.length?Math.round(c/L.length*100):0}%'></i></div><span>${c}/${L.length}</span></div><div class='hint'>${u} siswa di bawah KKM</div>`)}));
 return`<div class='card'><b>Selamat datang, ${esc(ME.nama)}</b><p class='hint'>Anda dapat mengisi nilai untuk mapel yang ditugaskan di kelas berikut.</p></div><div class='card'><b>Kelas dan mapel Anda</b>${R.join('')||'<p class="hint">Belum ada kelas atau mapel yang ditugaskan.</p>'}</div><div class='card'><div class='row'><button class='pri' onclick='go("nilai")'>Input nilai</button>${SRV()?'':"<button onclick='kirim()'>Kirim nilai ke admin (file)</button>"}</div></div>`};
const _R=window.render;window.render=function(){if(S&&!S.kelas)migrate();_R()};
{const st=TABS.splice(TABS.findIndex(t=>t[0]==='set'),1)[0];const gu=TABS.find(t=>t[0]==='guru'),cd=TABS.findIndex(t=>t[0]==='cad');if(gu)gu[3]='Data Master';st[3]='Sistem';TABS[cd][3]='';TABS.splice(cd,0,st)}
function tick(){const e=document.getElementById('clk');if(!e)return;const d=new Date(),p=n=>String(n).padStart(2,'0');e.innerHTML=`<b>${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}</b><span>${d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>`}
tick();setInterval(tick,1000);
migrate();render();
</script>
<script>
const SRV=()=>!!API_URL;
let TOK='',READY=false,NEEDSETUP=false,Q={},DIRTY=false,PT;
try{TOK=sessionStorage.getItem(K+'-tok')||''}catch(e){}
const O={};['gate','authUI','doAuth','save','logout','saveU','delU','setN','vCad','chPw'].forEach(n=>O[n]=window[n]);
async function api(a,d){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({a,token:TOK},d||{}))});const j=await r.json();
 if(j.err==='AUTH'){srvOut();throw new Error('Sesi berakhir, silakan login ulang.')}return j}
function srvOut(){TOK='';READY=false;ME=null;S=fresh();Q={};DIRTY=false;try{sessionStorage.removeItem(K+'-tok')}catch(e){}render()}
function setSt(t){const e=document.getElementById('sv');if(e)e.textContent=t}
function flushSoon(){clearTimeout(PT);setSt('Menyimpan...');PT=setTimeout(flush,800)}
async function flush(){if(!READY)return;const items=Object.values(Q),dirty=DIRTY;Q={};DIRTY=false;if(!items.length&&!dirty)return;
 try{if(dirty){const r=await api('saveConfig',{set:S.set,mapel:S.mapel,kelas:S.kelas||[],siswa:S.siswa.map(s=>({id:s.id,nis:s.nis,nama:s.nama,kelasId:s.kelasId||'',s:s.s||0,i:s.i||0,a:s.a||0,catatan:s.catatan||''}))});if(!r.ok)throw new Error(r.err)}
  if(items.length){const r=await api('saveNilai',{items});if(!r.ok)throw new Error(r.err)}
  setSt('\u2713 Tersimpan');setTimeout(()=>{if(!Object.keys(Q).length&&!DIRTY)setSt('')},1500)}
 catch(e){items.forEach(x=>{const k=x.siswaId+'|'+x.mapelId;if(!Q[k])Q[k]=x});if(dirty)DIRTY=true;setSt('\u26a0 Gagal menyimpan, mencoba lagi...');PT=setTimeout(flush,5000)}}
async function loadAll(){if(READY){clearTimeout(PT);await flush()}
 const r=await api('load');if(!r.ok)throw new Error(r.err);const f=fresh(),d=r.data;ME=r.me;
 S={set:Object.assign(f.set,d.set||{}),mapel:d.mapel||(ME.role==='admin'?f.mapel:[]),siswa:d.siswa,kelas:d.kelas||null,users:d.users||[]};
 if(!S.kelas){if(ME.role==='admin')migrate();else S.kelas=[]}
 if(!d.mapel&&ME.role==='admin'){DIRTY=true}
 READY=true;selM=null;selS=null;if(DIRTY)flushSoon()}
async function reloadAll(){try{await loadAll();render()}catch(e){alert(e.message)}}
window.gate=function(){if(!SRV())return O.gate();if(!READY){authUI(NEEDSETUP);return false}document.getElementById('login').style.display='none';if(!allowed(tab))tab='home';return true};
window.authUI=function(setup){O.authUI(setup);if(!SRV())return;document.querySelectorAll('#login .lfile').forEach(e=>{if(e.previousElementSibling)e.previousElementSibling.remove();e.remove()})};
window.doAuth=async function(setup){if(!SRV())return O.doAuth(setup);
 const u=g('lg_u').trim().toLowerCase(),p=g('lg_p'),er=document.getElementById('lg_e');
 if(!u||p.length<6){er.textContent='Username wajib diisi dan password minimal 6 karakter.';return}
 er.textContent='Memproses...';
 try{const r=await api(setup?'setup':'login',{user:u,password:p,nama:setup?g('lg_n').trim():''});
  if(!r.ok){er.textContent=r.err||'Gagal masuk.';return}
  TOK=r.token;try{sessionStorage.setItem(K+'-tok',TOK);const c=document.getElementById('lg_r');if(!c||c.checked)localStorage.setItem(K+'-ru',u);else localStorage.removeItem(K+'-ru')}catch(e){}
  NEEDSETUP=false;await loadAll();tab='home';render()}
 catch(e){er.textContent=(e.message||'').indexOf('Sesi')===0?e.message:'Tidak dapat terhubung ke server.'}};
window.save=function(){if(!SRV())return O.save();if(isAdmin())DIRTY=true;flushSoon()};
window.setN=function(id,k,val){if(!SRV())return O.setN(id,k,val);
 if(!mymapel().some(x=>x.id===selM))return;const s=S.siswa.find(x=>x.id===id);s.nilai=s.nilai||{};const c=s.nilai[selM]=s.nilai[selM]||{h:'',p:''};c[k]=val;paint();
 Q[id+'|'+selM]={siswaId:id,mapelId:selM,h:c.h,p:c.p};flushSoon()};
window.logout=function(){if(!SRV())return O.logout();clearTimeout(PT);flush().finally(srvOut)};
window.saveU=async function(){if(!SRV())return O.saveU();
 const n=g('g_n').trim(),u=g('g_u').trim().toLowerCase(),p=g('g_p'),id=g('g_i'),mp=[...document.querySelectorAll('#g_m input:checked')].map(x=>x.value);
 if(!n||!u){alert('Nama dan username wajib diisi.');return}
 try{const r=await api('saveUser',{id,nama:n,user:u,password:p,mapel:mp});if(!r.ok){alert(r.err);return}await loadAll();render()}catch(e){alert(e.message)}};
window.delU=async function(i){if(!SRV())return O.delU(i);if(!confirm('Hapus akun ini?'))return;
 try{const r=await api('delUser',{id:S.users[i].id});if(!r.ok){alert(r.err);return}await loadAll();render()}catch(e){alert(e.message)}};
window.chPw=async function(){if(!SRV())return O.chPw();const e=document.getElementById('pwe'),a=g('pw0'),b=g('pw1');
 if(b.length<6){e.textContent='Password baru minimal 6 karakter.';return}
 try{const r=await api('changePw',{old:a,new:b});e.textContent=r.ok?'Password berhasil diganti.':r.err;if(r.ok){document.getElementById('pw0').value='';document.getElementById('pw1').value=''}}catch(x){e.textContent=x.message}};
window.vCad=function(){if(!SRV())return O.vCad();
 return`<div class='card noprint'><b>Sinkronisasi</b><p class='hint'>Data tersimpan di Google Sheets. Muat ulang jika data terlihat belum terbaru.</p><div class='row'><button class='pri' onclick='reloadAll()'>Muat ulang dari server</button><button onclick='exp()'>Unduh salinan (JSON)</button></div></div>`};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SRV()&&READY&&!Object.keys(Q).length&&!DIRTY)loadAll().then(render).catch(()=>{})});
(async function(){if(!SRV())return;try{const r=await api('status');NEEDSETUP=!!r.setup;if(TOK&&!NEEDSETUP){try{await loadAll()}catch(e){TOK=''}}}catch(e){}render()})();
</script>
</body></html>
